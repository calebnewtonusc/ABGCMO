name: validate

on:
  push:
  pull_request:
  schedule:
    - cron: '0 9 1 * *'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skill structure and frontmatter
        run: python3 tools/check_structure.py
      - name: Self-claims match reality
        run: python3 tools/check_claims.py
      - name: Evidence tags and primary sources
        run: python3 tools/check_evidence.py

  links:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: External links resolve
        run: |
          grep -ohE 'https?://[^ )>"]+' $(git ls-files '*.md') | sed 's/[.,)]*$//' | sort -u > links.txt
          echo "checking $(wc -l < links.txt) links"
          bad=0
          while read -r u; do
            c=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 10 -A "Mozilla/5.0" "$u" || echo 000)
            case "$c" in
              2*|3*|401|403|429) ;;
              *) echo "::warning::$c $u"; bad=$((bad+1));;
            esac
          done < links.txt
          echo "$bad dead links"
